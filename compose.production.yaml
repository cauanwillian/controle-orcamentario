services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      target: api
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN}
      LEDGER_STORAGE_DIR: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploaded_ledger_files:/app/data/uploads
    ports:
      - "${API_PORT:-3001}:3001"

  worker:
    profiles: ["jobs"]
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      LEDGER_INBOX_DIR: /app/data/inbox/livro-razao
      LEDGER_INBOX_MIN_AGE_MS: ${LEDGER_INBOX_MIN_AGE_MS:-15000}
      LEDGER_INBOX_STABILITY_WAIT_MS: ${LEDGER_INBOX_STABILITY_WAIT_MS:-2000}
      LEDGER_STORAGE_DIR: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploaded_ledger_files:/app/data/uploads
      - ${LEDGER_INBOX_HOST_DIR:-/srv/samba/livro-razao}:/app/data/inbox/livro-razao

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      PORT: 3000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  uploaded_ledger_files:
